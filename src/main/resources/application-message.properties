# Messaging app Uses MongoDB
spring.data.mongodb.uri=${MONGO_CONNECTION}
spring.data.mongodb.database=Messages

# Support for Spring Boot 4
spring.mongodb.uri=${MONGO_CONNECTION}
spring.mongodb.database=Messages

# Notify sending

# Use 'azure-service-bus-entra' or 'azure-service-bus-connection-string'
trecapps.message.producer.strategy=${MESSAGE_PRODUCER_STRATEGY}
trecapps.message.producer.queue=notify
trecapps.message.producer.connection=${MESSAGE_PRODUCER_CONN}
trecapps.message.producer.namespace=${MESSAGE_PRODUCER_NAMESPACE}

# WebSocket / Kafka (disabled by default — set to true to enable real-time push)
trecapps.messaging.websocket.enabled=true
trecapps.messaging.kafka.topic=${KAFKA_TOPIC:conversation-events}
trecapps.messaging.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
trecapps.messaging.kafka.connection-string=${KAFKA_CONNECTION_STRING:}
