plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'jacoco'

    id "io.spring.dependency-management" version "1.1.7"
}

dependencyManagement {
    imports {
        mavenBom("com.azure.spring:spring-cloud-azure-dependencies:7.4.0")
    }
}

group = 'com.trecapps'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()

    maven {
        url azureRepoUrl
        name 'tcMavenRepo'
        credentials {
            username azureRepoUsername
            password azureRepoPassword
        }
    }

}

springBoot {
    mainClass = 'com.trecapps.comm.MultiDriver'
}

jar{
    //archiveClassifier=''
    enabled = false
}

dependencies {
    implementation 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2"

    //Enable Trec-Auth
    implementation(group: 'com.trecapps.trecauth', name: 'trec-auth-azure', version: '0.0.67')
    implementation(group: 'com.trecapps.trecauth', name: 'trec-auth-mongo', version: '0.0.67')


    implementation 'com.trecapps:notification-base:0.0.19'
    implementation "com.microsoft.azure:applicationinsights-runtime-attach:3.7.6"

    implementation("org.springframework.boot:spring-boot-starter-webflux")

    // Security Dependencies
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-quartz"
    //implementation 'com.zaxxer:HikariCP:6.2.1' // Used to resolve java.lang.AbstractMethodError: Receiver class
    // com.zaxxer.hikari.metrics.micrometer.MicrometerMetricsTrackerFactory

    // DB Support
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    //implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    // Azure Resources
    implementation 'com.azure:azure-messaging-servicebus'
    implementation 'com.azure:azure-identity'
    implementation 'com.trecapps.smpipeline:sm-pipeline:0.0.7'



    // For Notifications
    implementation "org.springframework.boot:spring-boot-starter-data-cassandra-reactive"
    // For Messages
    implementation "org.springframework.boot:spring-boot-starter-data-mongodb-reactive"

    implementation 'com.azure:azure-storage-blob'

    implementation 'com.auth0:java-jwt:+'
    //implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
    implementation "com.azure.spring:spring-cloud-azure-starter-keyvault" // Getting secret info from Azure Key Vault



    // WebSocket / Kafka (WebSocket messaging feature)
    // Native reactive WebSocket support is provided by spring-boot-starter-webflux.
    // The servlet spring-boot-starter-websocket (which drags in Tomcat/spring-web MVC)
    // is intentionally NOT used — it conflicts with the reactive Netty stack.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.jqwik:jqwik:1.9.3'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
//
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
}

test {
    useJUnitPlatform()
}